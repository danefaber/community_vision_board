{% extends "board/base.html" %}

{% block content %}
<h1>Community Calendar</h1>
<p>Approved community events. Click an event to see the full post.</p>

<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.22/index.global.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var calendarEl = document.getElementById("calendar");

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: "dayGridMonth",
      height: "auto",
      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,listMonth"
      },
      events: "{% url 'board:calendar_events' %}",
      noEventsContent: "No approved events yet."
    });

    calendar.render();
  });
</script>
<p>
    <a href="{% url 'board:home' %}">Back to Home</a>
</p>
{% endblock %}
