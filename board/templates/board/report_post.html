
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Post</title>
</head>
<body>
    <main>
        <h1>Report Post</h1>

        <h2>{{ post.title }}</h2>

        <p>
            Please explain why you are reporting this post.
            A moderator will review your report before
            deciding whether the post should be hidden.
        </p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Submit Report
            </button>
        </form>
    </main>
</body>
</html>
